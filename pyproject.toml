[project]
name = "myst-reid"
version = "0.1.0"
description = "MYST: Benchmarking Ecological and Cross-Medium Generalization in Sea Turtle Re-Identification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ftfy>=6.3.1",
    "hydra-core>=1.3.2",
    "ipykernel>=6.30.1",
    "libsvm-official>=3.37.0",
    "llvmlite>=0.40",
    "loguru>=0.7.3",
    "numba>=0.57",
    "pillow>=11.3.0",
    "pyiqa",
    "regex>=2025.9.18",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "timm>=1.0.20",
    "wandb>=0.22.2",
    "wildlife-datasets>=1.0.7",
    "wildlife-tools",
    "yacs>=0.1.8",
]

[tool.uv.workspace]
members = [
    "wildlife-tools",
]

[tool.uv.sources]
wildlife-tools = { workspace = true }
